services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-rails-app
    container_name: rails-cleaning-app
    restart: always
    ports:
      - "80:8080"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: d04769767c98a1b767deabd1350cb0acf943e629e3fded5555477391d0932ba177f47f74e326d0e2ff7dd51a8b5495a09d6
    volumes:
      - .:/rails
      - rails_storage:/rails/storage
    user: "0"
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: rails-cleaning-redis
    restart: always

volumes:
  rails_storage: {}   # ✅ Make sure this is present
